name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/IncidentCopilot.Tests/IncidentCopilot.Tests.csproj

      - name: Build
        run: dotnet build tests/IncidentCopilot.Tests/IncidentCopilot.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/IncidentCopilot.Tests/IncidentCopilot.Tests.csproj --configuration Release --no-build --verbosity normal
